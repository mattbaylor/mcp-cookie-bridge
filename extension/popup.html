<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #f8fafc; }
    .bridge-status { font-size: 11px; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; }
    .bridge-status.connected { background: #064e3b; color: #6ee7b7; }
    .bridge-status.disconnected { background: #1e293b; color: #94a3b8; }

    .profile {
      border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #0b1220;
    }
    .profile-top { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.green { background: #22c55e; }
    .dot.yellow { background: #f59e0b; }
    .dot.red { background: #ef4444; }
    .dot.gray { background: #475569; }
    .p-name { font-weight: 600; color: #f8fafc; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-tag { font-size: 10px; color: #64748b; border: 1px solid #334155; border-radius: 4px; padding: 0 5px; }
    .p-tag.prod { color: #fca5a5; border-color: #7f1d1d; }
    .p-host { font-size: 11px; color: #64748b; margin: 3px 0 6px; font-family: 'SF Mono','Menlo',monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-state { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
    .p-state .miss { color: #fca5a5; }
    .p-state .boot { color: #64748b; font-style: italic; }
    .p-blocked { font-size: 11px; color: #fca5a5; margin-bottom: 6px; }
    .p-actions { display: flex; gap: 8px; align-items: center; }
    button.prime {
      padding: 6px 10px; border: none; border-radius: 6px; background: #3b82f6; color: #fff;
      font-weight: 600; font-size: 12px; cursor: pointer;
    }
    button.prime:hover { background: #2563eb; }
    button.prime:disabled { background: #334155; color: #64748b; cursor: default; }
    .p-primestatus { font-size: 11px; color: #93c5fd; flex: 1; }

    .foot { display: flex; gap: 8px; margin-top: 4px; }
    button.secondary {
      flex: 1; padding: 9px; border: none; border-radius: 8px; background: #1e293b; color: #cbd5e1;
      font-weight: 600; font-size: 13px; cursor: pointer;
    }
    button.secondary:hover { background: #334155; }
    button.secondary:disabled { color: #64748b; cursor: default; }
    .link { text-align: center; margin-top: 10px; }
    .link a { color: #64748b; font-size: 11px; text-decoration: none; }
    .empty { color: #94a3b8; font-size: 12px; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>MCP Cookie Bridge</h1>

  <div id="bridgeStatus" class="bridge-status disconnected">MCP bridge: checking…</div>

  <div id="profiles"></div>
  <div id="empty" class="empty" style="display:none;">No profiles configured. Open Settings to add one.</div>

  <div class="foot">
    <button id="refreshBtn" class="secondary">Refresh Now</button>
  </div>
  <div class="link"><a href="#" id="settingsLink">⚙ Settings</a></div>

  <template id="profileTpl">
    <div class="profile">
      <div class="profile-top">
        <span class="dot gray p-dot"></span>
        <span class="p-name"></span>
        <span class="p-tag prod p-prod" style="display:none;">prod</span>
        <span class="p-tag p-default" style="display:none;">default</span>
      </div>
      <div class="p-host"></div>
      <div class="p-blocked" style="display:none;"></div>
      <div class="p-state"></div>
      <div class="p-actions">
        <button class="prime p-prime">Prime</button>
        <span class="p-primestatus"></span>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
